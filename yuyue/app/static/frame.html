<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小程序试玩</title>
<style>
  :root { --bg: #06082f; --fg: #f4f4f7; --muted: #a9abc4; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
  body { display: flex; align-items: center; justify-content: center; gap: 56px; padding: 24px; }
  .phone { width: 390px; height: min(844px, calc(100vh - 48px)); border-radius: 46px; padding: 12px;
    background: #111; box-shadow: 0 40px 80px -30px rgba(0,0,0,.7), inset 0 0 0 2px #2a2a2e; }
  iframe { width: 100%; height: 100%; border: 0; border-radius: 36px; background: #fff; display: block; }
  aside { max-width: 260px; font-size: 15px; line-height: 1.7; color: var(--muted); }
  aside b { display: block; color: var(--fg); font-size: 20px; font-weight: 600; margin-bottom: 8px; }
  a { color: var(--fg); }
  @media (max-width: 860px) { aside { display: none; } }
</style>
</head>
<body>
  <div class="phone"><iframe id="app" title="小程序试玩"></iframe></div>
  <aside><b>小程序网页试玩版</b>和真小程序是同一套代码编出来的，数据都是演示用的，随便点。用手机打开体验更接近真机。<br><br><a href="../../">← 回到案例介绍</a></aside>
  <script>document.getElementById('app').src = '../index.html?f=1' + location.hash</script>
</body>
</html>
